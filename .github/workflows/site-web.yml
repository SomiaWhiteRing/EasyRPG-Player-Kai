name: Build ZH Archive Web

on:
  workflow_dispatch:
    inputs:
      site_revision:
        description: ZH Archive commit containing the runtime source patches
        required: true
        type: string

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: SomiaWhiteRing/VIPRPG-ZH-Archive
          ref: ${{ inputs.site_revision }}
          path: site
          sparse-checkout: |
            lib/archive/easyrpg-runtime.json
            scripts/runtime-patches
          sparse-checkout-cone-mode: false
      - name: Apply pinned site source patches
        shell: python
        run: |
          import hashlib
          import json
          import pathlib
          import subprocess
          config = json.loads(pathlib.Path('site/lib/archive/easyrpg-runtime.json').read_text())
          for patch in config['sourcePatches']:
              path = pathlib.Path('site') / patch['path']
              assert hashlib.sha256(path.read_bytes()).hexdigest() == patch['sha256']
              subprocess.run(['git', 'apply', '--check', str(path)], check=True)
              subprocess.run(['git', 'apply', str(path)], check=True)
      - uses: actions/cache@v4
        with:
          path: |
            external/local-docker/web
            external/local-docker/home
          key: easyrpg-local-docker-web-${{ runner.os }}-${{ hashFiles('builds/docker/package.Dockerfile', 'builds/ci/package-ubuntu-nightly.cache.env') }}
          restore-keys: |
            easyrpg-local-docker-web-${{ runner.os }}-
      - name: Build Web package
        shell: pwsh
        run: ./builds/package-docker.ps1 web
      - name: Include pinyin dictionary license
        run: |
          cp resources/pinyin/LICENSE-rime-pinyin-simp.txt build/package/nightly-web/
          cd build/package/nightly-web
          zip -9 ../../artifacts/EasyRPG-Player-Kai-nightly-web.zip LICENSE-rime-pinyin-simp.txt
      - uses: actions/upload-artifact@v4
        with:
          name: zh-archive-web
          path: build/artifacts/EasyRPG-Player-Kai-nightly-web.zip
          if-no-files-found: error
