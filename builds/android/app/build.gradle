def androidBuildDir = project.findProperty("androidBuildDir") ?: System.getenv("ANDROID_BUILD_DIR")
def androidCxxBuildDir = project.findProperty("androidCxxBuildDir") ?: System.getenv("ANDROID_CXX_BUILD_DIR")
def androidUseCcache = (project.findProperty("androidUseCcache") ?: System.getenv("ANDROID_USE_CCACHE") ?: "false").toBoolean()
def releaseHeading = rootProject.file("../../RELEASE.md").readLines("UTF-8").first().trim()
if (!(releaseHeading ==~ /# [0-9]{4}\.(?:[1-9]|1[0-2])\.[1-9][0-9]*/)) {
    throw new GradleException("RELEASE.md must start with a calendar version heading")
}

if (androidBuildDir) {
    buildDir = file(androidBuildDir)
}

apply plugin: 'com.android.application'

android {
    namespace "org.easyrpg.player"
    ndkVersion "28.2.13676358"
    compileSdk 36
    assetPacks = [":assets"]
    buildFeatures {
        prefab true
    }
    androidResources {
        noCompress += ['sf2']
    }
    packaging {
        jniLibs {
            // Keep all four ABIs while reducing the downloadable APK size.
            // Android extracts the compressed libraries during installation.
            useLegacyPackaging = true
        }
    }
    defaultConfig {
        applicationId "org.easyrpg.player.kai"
        minSdkVersion 23
        targetSdkVersion 36
        versionName releaseHeading.substring(2)
        versionCode Integer.parseInt(project.findProperty("VERSION_CODE_OVERRIDE") ?: VERSION_CODE)
    }
    signingConfigs {
        nightlyDebug {
            storeFile file(project.findProperty("NIGHTLY_DEBUG_STORE_FILE") ?: "../nightly-debug.keystore")
            storePassword project.findProperty("NIGHTLY_DEBUG_STORE_PASSWORD") ?: "easyrpgkai"
            keyAlias project.findProperty("NIGHTLY_DEBUG_KEY_ALIAS") ?: "easyrpg-kai-nightly"
            keyPassword project.findProperty("NIGHTLY_DEBUG_KEY_PASSWORD") ?: "easyrpgkai"
        }
        release {
            if (RELEASE_STORE_FILE) {
                storeFile file(RELEASE_STORE_FILE)
            }
            storePassword RELEASE_STORE_PASSWORD
            keyAlias RELEASE_KEY_ALIAS
            keyPassword RELEASE_KEY_PASSWORD
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.nightlyDebug
            ndk {
                abiFilters = []
                abiFilters.addAll(ABI_FILTERS_DEBUG.split(','))
            }
        }
        release {
            debuggable false
            jniDebuggable false
            ndk {
                abiFilters = []
                abiFilters.addAll(ABI_FILTERS_RELEASE.split(','))
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
            // CI signs the unsigned APK separately so Gradle never receives the key.
            if (RELEASE_STORE_FILE && !project.hasProperty("androidUnsignedRelease")) {
                signingConfig signingConfigs.release
            }
        }
    }
    externalNativeBuild {
        cmake {
            path "../../../CMakeLists.txt"
            version "3.22.1"
            if (androidCxxBuildDir) {
                buildStagingDirectory file(androidCxxBuildDir)
            }
        }
    }
    lint {
        abortOnError false
        disable 'MissingTranslation'
    }
    defaultConfig {
        externalNativeBuild {
            cmake {
                arguments "-DPLAYER_GRADLE_BUILD=ON",
                        "-DBUILD_SHARED_LIBS=ON",
                        "-DPLAYER_ENABLE_TESTS=OFF",
                        "-DPLAYER_TARGET_PLATFORM=SDL3"

                if (androidUseCcache) {
                    arguments.addAll([
                            "-DCMAKE_C_COMPILER_LAUNCHER=ccache",
                            "-DCMAKE_CXX_COMPILER_LAUNCHER=ccache"])
                }

                if (project.hasProperty("toolchainDirs") && project.toolchainDirs) {
                    arguments.add('-DPLAYER_ANDROID_TOOLCHAIN_PATH=' + project.toolchainDirs)
                } else if (System.getenv('EASYRPG_BUILDSCRIPTS')) {
                    arguments.add('-DPLAYER_ANDROID_TOOLCHAIN_PATH=' + System.getenv('EASYRPG_BUILDSCRIPTS') + '/android')
                }

                if (project.hasProperty("cmakeOptions")) {
                    arguments.addAll(project.cmakeOptions.split(" "))
                }
            }
        }
    }
}

allprojects {
    repositories {
        maven {
            url 'https://maven.google.com'
        }
    }
}

dependencies {
    implementation files("SDL3-${sdlVersion}.aar")
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation "androidx.activity:activity:1.13.0"
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'org.ini4j:ini4j:0.5.4'
}

afterEvaluate {
    preBuild.dependsOn downloadSdlAar
}

tasks.register('downloadSdlAar') {
    def sdlAarDest = file("SDL3-${sdlVersion}.aar")
    inputs.property("sdlVersion", sdlVersion)
    outputs.file(sdlAarDest)

    doLast {
        if (!sdlAarDest.exists()) {
            println "Downloading SDL ${sdlVersion} AAR..."
            def sdlZipDest = layout.buildDirectory.file("sdl3.zip").get().asFile
            sdlZipDest.parentFile.mkdirs()
            new URL("https://github.com/libsdl-org/SDL/releases/download/release-${sdlVersion}/SDL3-devel-${sdlVersion}-android.zip")
                .withInputStream { i -> sdlZipDest.withOutputStream { it << i } }
            copy {
                from zipTree(sdlZipDest)
                into projectDir
                include "**/*.aar"
                eachFile { FileCopyDetails fcp ->
                    fcp.relativePath = new RelativePath(true, fcp.file.name)
                }
                includeEmptyDirs = false
            }
        }
    }
}
